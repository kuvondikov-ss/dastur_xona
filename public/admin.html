<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dasturxona Admin</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#143252}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.card{background:#fff;border:1px solid #dde3ea;border-radius:18px;padding:22px;margin:18px 0}input,textarea,button,select{font:inherit;padding:11px;border:1px solid #ccd5df;border-radius:10px}textarea{width:100%;min-height:320px;box-sizing:border-box;font-family:monospace}button{background:#143252;color:#fff;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#fff;color:#143252}.tabs button.active{background:#143252;color:#fff}.muted{color:#667}.status{font-weight:700}</style></head><body><div class="wrap"><div class="top"><div><h1>Dasturxona Admin</h1><p class="muted">Katalog, loyihalar, yangiliklar, jamoa, sozlamalar va buyurtmalar.</p></div><a href="/">Saytga qaytish</a></div><div class="card"><h2>Kirish</h2><input id="u" placeholder="Admin login"><input id="p" type="password" placeholder="Parol"><button onclick="load()">Kirish</button> <span id="status" class="status"></span></div><div class="card" id="editor" hidden><div class="tabs" id="tabs"></div><h2 id="title"></h2><p class="muted">JSON formatida tahrirlang. Saqlashdan oldin sintaksisni tekshiring.</p><textarea id="json"></textarea><br><br><button onclick="save()">Saqlash</button></div></div><script>let data={},section='products',auth='';const secs=['products','projects','news','team','settings','orders'];async function load(){auth='Basic '+btoa(u.value+':'+p.value);const r=await fetch('/api/admin/data',{headers:{Authorization:auth}});if(!r.ok){status.textContent='Kirish xato';return}data=await r.json();status.textContent='Kirish muvaffaqiyatli';editor.hidden=false;tabs.innerHTML=secs.map(x=>`<button onclick="pick('${x}')">${x}</button>`).join('');pick('products')}function pick(s){section=s;title.textContent=s;json.value=JSON.stringify(data[s],null,2);[...tabs.children].forEach(b=>b.classList.toggle('active',b.textContent===s))}async function save(){try{const value=JSON.parse(json.value);const r=await fetch('/api/admin/'+section,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:auth},body:JSON.stringify(value)});if(!r.ok)throw 0;data[section]=value;status.textContent='Saqlandi'}catch(e){status.textContent='JSON yoki server xatosi'}}</script></body></html>
