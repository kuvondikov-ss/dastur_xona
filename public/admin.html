<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dasturxona — Boshqaruv</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#143252;font:500 15px/1.55 Montserrat,Arial,sans-serif}.wrap{max-width:1160px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:28px}h2{margin:0 0 16px;font-size:22px}.muted{color:#66778b}.panel{background:white;border:1px solid #dce4ec;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 5px 20px #14325208}.login{max-width:440px;margin:65px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-weight:650}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#143252;font:inherit}textarea{min-height:115px}button{border:0;border-radius:10px;background:#143252;color:white;padding:12px 18px;font:650 14px Montserrat,Arial,sans-serif;cursor:pointer}button.secondary{background:#e8eef5;color:#143252}button.danger{background:#b93c38}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}.tabs button{background:#e7edf4;color:#143252}.tabs button.active{background:#143252;color:white}.items{display:grid;gap:10px;margin-top:22px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #e2e8f0;border-radius:12px;padding:12px}.item img{width:65px;height:56px;object-fit:cover;border-radius:8px}.item .info{flex:1;min-width:0}.item strong{display:block}.actions{display:flex;gap:7px;flex-wrap:wrap}.preview{width:180px;max-height:120px;object-fit:contain;display:block;margin-top:8px}.notice{min-height:24px;font-weight:650}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{flex-wrap:wrap}.wrap{padding:16px 12px}}</style></head><body><div class="wrap"><header><div><h1>Dasturxona Admin</h1><div class="muted">Do‘kon, bannerlar va yangiliklarni boshqarish</div></div><div><a href="/" style="color:#143252">← Saytga qaytish</a> <button id="logout" class="secondary hidden">Chiqish</button></div></header>
<section id="loginPanel" class="panel login"><h2>Admin panelga kirish</h2><form id="loginForm" class="grid"><div class="field full"><label>Login<input id="username" autocomplete="username" required></label></div><div class="field full"><label>Parol<input id="password" type="password" autocomplete="current-password" required></label></div><button class="full">Kirish</button></form></section>
<section id="dashboard" class="hidden"><nav class="tabs" id="tabs"><button data-tab="products" class="active">Mahsulotlar</button><button data-tab="banners">Karusel bannerlari</button><button data-tab="news">Yangiliklar</button><button data-tab="orders">Buyurtmalar</button></nav><div class="panel"><h2 id="heading">Mahsulotlar</h2><form id="entryForm" class="grid"></form><div id="items" class="items"></div></div></section><p class="notice" id="notice" role="status"></p></div><script>
let db={},auth='',tab='products',editing=-1;const $=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const field=(name,label,type='text',value='',required=false)=>'<div class="field'+(type==='textarea'?' full':'')+'"><label>'+label+(type==='textarea'?'<textarea name="'+name+'">'+escapeHtml(value)+'</textarea>':'<input name="'+name+'" type="'+type+'" value="'+escapeHtml(value)+'" '+(required?'required':'')+'>')+'</label></div>';const notice=s=>$('notice').textContent=s;
async function request(url,options={}){const r=await fetch(url,{...options,headers:{Authorization:auth,...options.headers}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Server xatosi ('+r.status+')');return data}
$('loginForm').onsubmit=async e=>{e.preventDefault();auth='Basic '+btoa(unescape(encodeURIComponent($('username').value+':'+$('password').value)));try{db=await request('/api/admin/data');db.banners||=[];$ ('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');$('password').value='';notice('Kirish muvaffaqiyatli');render()}catch(err){auth='';notice('Login yoki parol noto‘g‘ri')}};
$('logout').onclick=()=>{auth='';db={};$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('logout').classList.add('hidden');notice('Tizimdan chiqdingiz')};
$('tabs').onclick=e=>{const btn=e.target.closest('[data-tab]');if(!btn)return;tab=btn.dataset.tab;editing=-1;render()};
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('heading').textContent=({products:'Do‘kon mahsulotlari',banners:'Bosh sahifa karuseli',news:'Yangiliklar',orders:'Buyurtmalar'})[tab];const f=$('entryForm');if(tab==='orders'){f.innerHTML='';$('items').innerHTML=(db.orders||[]).map(o=>'<div class="item"><div class="info"><strong>'+escapeHtml(o.ref)+'</strong>'+escapeHtml(o.createdAt||'')+' · '+escapeHtml(o.status)+'</div></div>').join('')||'Buyurtmalar yo‘q';return}const v=editing>=0?(db[tab]||[])[editing]:{};if(tab==='products')f.innerHTML=field('name','Mahsulot nomi','text',v.name,true)+field('price','Narxi (so‘m)','number',v.price??'',true)+field('stock','Ombordagi soni','number',v.stock??0,true)+field('categoryName','Kategoriya','text',v.categoryName||'Merch')+field('short','Qisqa tavsif','text',v.short)+field('sizes','O‘lchamlar (vergul bilan)','text',(v.sizes||[]).join(', '))+field('description','Batafsil tavsif','textarea',v.description)+field('image','Rasm manzili (yoki pastdan yuklang)','text',v.image)+uploadField();
if(tab==='banners')f.innerHTML=field('title','Banner sarlavhasi','text',v.title,true)+field('subtitle','Kichik sarlavha','text',v.subtitle)+field('description','Banner matni','textarea',v.description)+field('link','Tugma havolasi','text',v.link||'#/dokon')+field('image','Banner rasmi','text',v.image)+uploadField();
if(tab==='news')f.innerHTML=field('title','Yangilik sarlavhasi','text',v.title,true)+field('excerpt','Qisqa matn','textarea',v.excerpt)+field('body','To‘liq yangilik','textarea',v.body,true)+field('category','Kategoriya (news, project, event)','text',v.category||'news')+field('cover','Muqova rasmi','text',v.cover)+uploadField('cover')+field('publishedAt','Sana','date',(v.publishedAt||new Date().toISOString()).slice(0,10))+ '<div class="field"><label>Holati<select name="status"><option value="published" '+(v.status!=='draft'?'selected':'')+'>E’lon qilingan</option><option value="draft" '+(v.status==='draft'?'selected':'')+'>Qoralama</option></select></label></div>';
f.innerHTML+='<div class="full actions"><button type="submit">'+(editing>=0?'O‘zgarishlarni saqlash':'Yangi qo‘shish')+'</button><button type="button" class="secondary" id="reset">Tozalash</button></div>';$('reset').onclick=()=>{editing=-1;render()};$('items').innerHTML=(db[tab]||[]).map((x,i)=>'<div class="item">'+(x.image||x.cover?'<img src="'+escapeHtml(x.image||x.cover)+'" alt="">':'')+'<div class="info"><strong>'+escapeHtml(x.name||x.title)+'</strong>'+escapeHtml(tab==='products'?(x.price||0)+' so‘m · '+(x.stock??'—')+' dona':x.description||x.excerpt||'')+'</div><div class="actions"><button type="button" class="secondary" data-edit="'+i+'">Tahrirlash</button><button type="button" class="danger" data-delete="'+i+'">O‘chirish</button></div></div>').join('')||'<p class="muted">Hozircha ma’lumot yo‘q.</p>'}
function uploadField(target='image'){return '<div class="field full"><label>Kompyuterdan rasm yuklash<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-upload="'+target+'"></label><small>PNG, JPG, WebP yoki GIF · 5 MB gacha</small></div>'}
$('entryForm').onchange=async e=>{if(!e.target.matches('[data-upload]')||!e.target.files[0])return;const file=e.target.files[0];if(file.size>5*1024*1024){notice('Rasm 5 MB dan kichik bo‘lishi kerak');return}try{const result=await request('/api/admin/upload',{method:'POST',headers:{'Content-Type':file.type},body:file});$('entryForm').elements[e.target.dataset.upload].value=result.url;notice('Rasm yuklandi')}catch(err){notice('Rasm yuklanmadi: '+err.message)}};
$('entryForm').onsubmit=async e=>{e.preventDefault();const raw=Object.fromEntries(new FormData(e.target));delete raw[''];let obj=editing>=0?{...db[tab][editing]}:{};Object.assign(obj,raw);if(tab==='products'){obj.price=Number(raw.price);obj.stock=Number(raw.stock);obj.sizes=raw.sizes.split(',').map(s=>s.trim()).filter(Boolean);obj.category=obj.category||'merch';obj.categoryName=obj.categoryName||'Merch';obj.physical=true;obj.id=obj.id||'product-'+Date.now().toString(36);obj.isSample=false;delete obj.cover}if(tab==='banners'){obj.id=obj.id||'banner-'+Date.now().toString(36)}if(tab==='news'){obj.slug=obj.slug||'news-'+Date.now().toString(36);obj.publishedAt=new Date(raw.publishedAt||Date.now()).toISOString();obj.isSample=false;delete obj.image}const list=[...(db[tab]||[])];if(editing>=0)list[editing]=obj;else list.unshift(obj);await saveList(list)};
$('items').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){editing=Number(edit.dataset.edit);render();window.scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('Rostdan ham o‘chirasizmi?')){const list=[...db[tab]];list.splice(Number(del.dataset.delete),1);await saveList(list)}};
async function saveList(list){try{await request('/api/admin/'+tab,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(list)});db[tab]=list;editing=-1;render();notice('Muvaffaqiyatli saqlandi')}catch(err){notice('Saqlashda xato: '+err.message)}}
</script></body></html>
