<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DasturXona — Boshqaruv</title><link rel="icon" href="/assets/brand-mark.svg"><link rel="stylesheet" href="/assets/fonts.css"><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/admin.js" defer></script></head>
<body><div class="admin-wrap"><header class="admin-header"><a href="/" aria-label="DasturXona bosh sahifa"><img src="/assets/wordmark.svg" width="190" height="43" alt="DasturXona"></a><div class="admin-header-actions"><a class="text-link" href="/" target="_blank" rel="noopener noreferrer">Saytni ko‘rish ↗</a><button id="logout" class="btn btn-secondary" type="button" hidden>Chiqish</button></div></header>
<section id="loginPanel" class="admin-login"><span class="eyebrow">DasturXona boshqaruvi</span><h1>Admin panelga kirish</h1><p>Mahsulotlar, yangiliklar va buyurtmalarni boshqaring.</p><form id="loginForm"><div class="field"><label for="username">Login</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Parol</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary btn-full" type="submit">Kirish</button><p id="loginError" class="error" role="alert" hidden></p></form></section>
<div id="dashboard" class="admin-layout" hidden><nav id="tabs" class="admin-nav" aria-label="Boshqaruv bo‘limlari"><button type="button" data-tab="products" aria-current="page">Mahsulotlar</button><button type="button" data-tab="banners">Bannerlar</button><button type="button" data-tab="news">Yangiliklar</button><button type="button" data-tab="projects">IT loyihalar</button><button type="button" data-tab="team">Jamoa</button><button type="button" data-tab="orders">Buyurtmalar</button><button type="button" data-tab="settings">Sozlamalar</button><button type="button" data-tab="bts">BTS Express</button></nav><main class="admin-main"><div class="admin-title"><div><span class="eyebrow">Boshqaruv paneli</span><h1 id="heading">Mahsulotlar</h1><p id="sectionHint"></p></div><button id="addEntry" class="btn btn-primary" type="button">+ Yangi qo‘shish</button></div><div id="listTools" class="admin-tools"><label class="search-field"><span class="sr-only">Ro‘yxatdan qidirish</span><input id="listSearch" type="search" placeholder="Ro‘yxatdan qidirish…"></label><span id="listCount" class="mini-note"></span></div><div id="items" class="admin-items"></div></main></div>
<div id="notice" class="admin-notice" role="status" aria-live="polite" hidden></div></div>
<dialog id="editor" aria-labelledby="editorTitle"><div class="dialog-head"><h2 id="editorTitle">Yangi yozuv</h2><button id="closeEditor" class="icon-btn" type="button" aria-label="Oynani yopish">✕</button></div><form id="entryForm" class="dialog-body"><div id="entryFields" class="admin-fields"></div><p id="formError" class="error" role="alert" hidden></p><div class="admin-editor-actions"><button id="saveEntry" class="btn btn-primary" type="submit">Saqlash</button><button id="cancelEditor" class="btn btn-secondary" type="button">Bekor qilish</button></div></form></dialog>
</body></html>
